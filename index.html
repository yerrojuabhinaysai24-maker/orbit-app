<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ORBIT — The world, in context.</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f6f7fa;--card:#fff;--text:#111318;--muted:#70747d;--line:#e5e7ec;--a:#5d67ff;--a2:#855cff}
[data-theme=dark]{--bg:#0b0c10;--card:#15171d;--text:#f5f6f8;--muted:#a7aab3;--line:#292c34}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}
.app{max-width:760px;margin:auto;padding:env(safe-area-inset-top) 12px 85px}header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);padding:12px 2px 8px}
.brand{display:flex;align-items:center;gap:9px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center}.logo:after{content:"";width:14px;height:14px;border:2px solid white;border-left-color:transparent;border-radius:50%;transform:rotate(-30deg)}.name{font-size:21px;font-weight:800;letter-spacing:-.7px}.tag{font-size:10px;color:var(--muted)}
.search{height:44px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;display:flex;align-items:center;padding:0 13px;gap:8px}.search input{width:100%;border:0;outline:0;background:none;color:var(--text);font-size:15px}
.chips{display:flex;gap:7px;overflow:auto;padding:10px 0 3px}.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:8px 13px;white-space:nowrap;font-size:12px;font-weight:700}.chip.active{background:linear-gradient(110deg,var(--a),var(--a2));color:white;border-color:transparent}
.status{font-size:11px;color:var(--muted);min-height:18px;padding:4px}
.feed{display:grid;gap:14px;padding-top:5px}.story{background:var(--card);border:1px solid var(--line);border-radius:23px;overflow:hidden}.story img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#20232a}.body{padding:15px}.cat{text-transform:uppercase;letter-spacing:.8px;color:var(--a);font-size:10px;font-weight:800}.title{font-size:23px;line-height:1.1;font-weight:800;letter-spacing:-.55px;margin:7px 0}.desc{color:var(--muted);font-size:15px;line-height:1.45}.meta{font-size:11px;color:var(--muted);margin-top:11px}.actions{display:flex;gap:7px;margin-top:13px}.btn{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:9px 11px;font-size:12px;font-weight:700}.primary{background:linear-gradient(110deg,var(--a),var(--a2));color:#fff;border-color:transparent}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);z-index:20;background:color-mix(in srgb,var(--card) 93%,transparent);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 10px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.nav{border:0;background:none;color:var(--muted);font-size:11px;font-weight:700}.nav.active{color:var(--a)}.loading,.empty{text-align:center;color:var(--muted);padding:60px 20px}.error{text-align:center;color:var(--muted);padding:45px 20px}.toast{display:none;position:fixed;z-index:50;bottom:85px;left:50%;transform:translateX(-50%);background:#17191f;color:white;padding:11px 15px;border-radius:14px;font-size:13px}
</style>
</head>
<body>
<div class="app" id="app">
<header>
<div class="brand"><div class="logo"></div><div><div class="name">ORBIT</div><div class="tag">The world, in context.</div></div></div>
<div class="search">⌕ <input id="q" placeholder="Search stories"></div>
<div class="chips" id="chips"></div>
<div class="status" id="status">Connecting to live news…</div>
</header>
<main id="feed" class="feed"></main>
</div>
<nav class="bottom">
<button class="nav active" data-p="home">⌂<br>Home</button>
<button class="nav" data-p="saved">♡<br>Saved</button>
<button class="nav" data-p="settings">⚙<br>Settings</button>
</nav>
<div id="toast" class="toast"></div>

<script>
const proxy="https://api.rss2json.com/v1/api.json?rss_url=";
const feeds={
"World":"https://feeds.bbci.co.uk/news/world/rss.xml",
"Technology":"https://feeds.bbci.co.uk/news/technology/rss.xml",
"Business":"https://feeds.bbci.co.uk/news/business/rss.xml",
"Sports":"https://feeds.bbci.co.uk/sport/0/rss.xml",
"Entertainment":"https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml",
"Health":"https://feeds.bbci.co.uk/news/health/rss.xml",
"Science":"https://feeds.bbci.co.uk/news/science_and_environment/rss.xml",
"Education":"https://feeds.bbci.co.uk/news/education/rss.xml",
"Politics":"https://feeds.bbci.co.uk/news/politics/rss.xml",
"Top Stories":"https://feeds.bbci.co.uk/news/rss.xml"
};
const cats=["Top Stories","World","Technology","Business","Sports","Entertainment","Health","Science","Education","Politics"];
let cat="Top Stories",articles=[],saved=JSON.parse(localStorage.getItem("orbitSaved")||"[]"),page="home";

const $=id=>document.getElementById(id);
function chips(){ $("chips").innerHTML=cats.map(c=>`<button class="chip ${c===cat?'active':''}" onclick="selectCat('${c}')">${c}</button>`).join("") }
function ago(d){let n=(Date.now()-new Date(d).getTime())/60000;if(!isFinite(n))return "";return n<60?Math.max(1,Math.round(n))+"m ago":n<1440?Math.round(n/60)+"h ago":Math.round(n/1440)+"d ago"}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function imageOf(x){return x.thumbnail||x.enclosure?.link||""}
function descriptionOf(x){let s=(x.description||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();return s||"Open the original report for the full story and details."}
async function load(c=cat){
  $("status").textContent="Live feed • loading latest stories…";
  $("feed").innerHTML='<div class="loading">Finding the latest stories…</div>';
  try{
    const u=proxy+encodeURIComponent(feeds[c]);
    const r=await fetch(u,{cache:"no-store"});
    if(!r.ok)throw new Error("feed");
    const data=await r.json();
    if(data.status!=="ok"||!data.items?.length)throw new Error("empty");
    articles=data.items.map(x=>({title:x.title,url:x.link,date:x.pubDate,source:data.feed?.title||"BBC News",image:imageOf(x),desc:descriptionOf(x),cat:c}));
    $("status").textContent=`Live feed • ${articles.length} current stories • ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`;
    render();
  }catch(e){
    $("status").textContent="Live feed unavailable";
    $("feed").innerHTML=`<div class="error">We couldn't reach this live RSS feed right now.<br><br><button class="btn primary" onclick="load()">Try again</button><p style="font-size:11px;margin-top:18px">This test uses public RSS feeds through a free RSS-to-JSON bridge. No paid news API or API key is used.</p></div>`;
  }
}
function card(x){let s=saved.includes(x.url);return `<article class="story"><img src="${esc(x.image)}" ${x.image?'':'style="display:none"'} onerror="this.style.display='none'"><div class="body"><div class="cat">${esc(x.cat)}</div><div class="title">${esc(x.title)}</div><div class="desc">${esc(x.desc)}</div><div class="meta"><b>${esc(x.source)}</b> · ${ago(x.date)}</div><div class="actions"><button class="btn" onclick="save('${encodeURIComponent(x.url)}')">${s?'♥ Saved':'♡ Save'}</button><button class="btn" onclick="share('${encodeURIComponent(x.title)}','${encodeURIComponent(x.url)}')">↗ Share</button><button class="btn primary" onclick="location.href='${encodeURI(x.url)}'">Read source</button></div></div></article>`}
function render(){
  chips();
  if(page==="saved"){let a=articles.filter(x=>saved.includes(x.url));$("feed").innerHTML=a.length?a.map(card).join(""):'<div class="empty">Nothing saved yet.</div>';return}
  if(page==="settings"){$("feed").innerHTML=`<h2>Settings</h2><article class="story"><div class="body"><div class="title" style="font-size:18px">Language</div><div class="desc">English</div><div class="actions"><button class="btn primary">Choose language</button></div><div class="title" style="font-size:18px;margin-top:22px">Region</div><div class="desc">Select your country for local news.</div><div class="actions"><button class="btn">Select country</button></div><div class="title" style="font-size:18px;margin-top:22px">Appearance</div><div class="actions"><button class="btn" onclick="theme()">Toggle light / dark</button></div></div></article>`;return}
  let term=$("q").value.toLowerCase();let a=articles.filter(x=>(x.title+x.desc).toLowerCase().includes(term));$("feed").innerHTML=a.length?a.map(card).join(""):'<div class="empty">No matching stories.</div>';
}
function selectCat(c){cat=c;page="home";$("q").value="";document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.p==="home"));load(c)}
function save(u){u=decodeURIComponent(u);saved=saved.includes(u)?saved.filter(x=>x!==u):[...saved,u];localStorage.setItem("orbitSaved",JSON.stringify(saved));toast(saved.includes(u)?"Saved":"Removed");render()}
async function share(t,u){t=decodeURIComponent(t);u=decodeURIComponent(u);if(navigator.share)navigator.share({title:"ORBIT",text:t+"\n\nThe world, in context.",url:u});else toast("Share unavailable")}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1600)}
function theme(){let d=document.documentElement.getAttribute("data-theme")==="dark";document.documentElement.setAttribute("data-theme",d?"light":"dark")}
$("q").addEventListener("input",render);
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{page=b.dataset.p;document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x===b));render()});
let startY=0;document.addEventListener("touchstart",e=>startY=e.touches[0].clientY,{passive:true});document.addEventListener("touchend",e=>{if(scrollY<10&&e.changedTouches[0].clientY-startY>90)load()},{passive:true});
chips();load();
</script>
</body>
</html>
